    Document:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          description: >-
            Manages document metadata, status, and versioning, including related parties like
            authors or publishers. Content is handled via an Attachment as either inline binary
            (content) or an external reference (url). Detailed attributes for specific document
            types are governed by a linked DocumentSpecification.
          properties:
            name:
              type: string
              description: A string used to give a name to the document
            documentType:
              type: string
              description: 'Name of the document type, for example: paperback, passport'
            version:
              type: string
              description: The version of the document
            category:
              deprecated: true
              type: array
              description: Collection of categories applicable
              items:
                $ref: '#/components/schemas/CategoryRef'
            creationDate:
              type: string
              format: date-time
              description: >-
                The date and time the document was created. A date and time formatted in compliance
                with the ISO8601 standard must be used. To be set by the API server.
            expiryDate:
              type: string
              format: date-time
              description: >-
                The date and time the document is to expire. Unlike validFor.endDateTime, which
                marks the end of the document's legal or commercial effectiveness, this field refers
                to the administrative expiry of the document. A date and time formatted in
                compliance with the ISO8601 standard must be used.
            description:
              type: string
              description: free-text description of the document
            documentRelationship:
              type: array
              description: >-
                A collection of references to documents that are related to this document. Documents
                may be related for various business reasons, such as a contract amendment
                superseding an original contract, an invoice supported by an itemized bill, or a
                legal attachment forming part of an agreement.
              items:
                $ref: '#/components/schemas/DocumentRef'
            documentSpecification:
              $ref: '#/components/schemas/DocumentSpecificationRef'
            lastUpdate:
              type: string
              format: date-time
              description: >-
                The date and time the document was last modified. A date and time formatted in
                compliance with the ISO8601 standard must be used. To be set by the API server.
            status:
              type: string
              description: >-
                Represents the status of the document. Example: draft, proposed, approved,
                published, cancelled, superseded.
            attachment:
              type: array
              description: >-
                The actual content of the document, provided either by value (inline data or a URL
                to the content) or by reference to an existing Attachment resource. A document may
                have multiple attachments representing different components of the same content.
              items:
                $ref: '#/components/schemas/AttachmentRefOrValue'
            characteristic:
              type: array
              description: >-
                A collection of name-value pairs that describe additional properties of the
                document. The set of permitted characteristics and their value types are defined by
                the associated DocumentSpecification (via the specCharacteristic list). For example,
                a document based on a 'paperback' specification may carry characteristics such as
                pages (integer, e.g. 312), language (string, e.g. 'en'), or isbn-10 (string, e.g.
                '9781492026921').
              items:
                $ref: '#/components/schemas/Characteristic'
            relatedEntity:
              $ref: '#/components/schemas/RelatedEntity'
            relatedParty:
              type: array
              description: A collection of related parties
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            externalIdentifier:
              type: array
              description: >-
                Identifiers assigned to this document by external systems (e.g. a KYC platform or
                document archive), allowing the document to be correlated across systems.
              items:
                $ref: '#/components/schemas/ExternalIdentifier'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
          required:
            - name
      discriminator:
        propertyName: '@type'
        mapping:
          Document: '#/components/schemas/Document'
