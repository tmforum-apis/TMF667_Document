openapi: 3.0.1
info:
  title: Document Management
  description: >-
    TMF667 Document Management API describes the metadata of a Document, such as the name,
    creationDate and lifecycle status. The (typically binary) body of this document (such as a Word
    doc, PDF, Video clip, or Image) will be held in the associated Attachment(s) either by Ref or
    Value. If by value - the binary content is held in the Attachment.content. If by reference, the
    Attachment.url might point to a (file:) or remote (http:) pointer to the Document media. 


    A Document may be associated with a DocumentSpecification, which will detail the characteristics
    of that type of Document (an Image may have a width, height and format; a Video may have a
    length and format).


    A Document has a collection of RelatedParty entries, for roles such as author, reviewer,
    publisher, and a lifecycle status to take the document through a simple set of production
    stages. Also the Attachment is made available as a resource to access the reference, or create
    or update the Attachment.
  version: 5.0.0
  x-generation-tooling-version: v8.6.13
  x-generation-data-model-version: unknown
  x-generation-date: '2026-08-04T12:25:50.729Z'
  x-api-id: TMF667
  license:
    name: Apache License 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
servers:
  - url: '{apiRoot}'
    variables:
      apiRoot:
        default: 'https://serverRoot/tmf-api/document/v5'
        enum:
